<!DOCTYPE html><html><body>
<select id="s1"><option value="x">X</option><option value="y" selected>Y</option></select>
<script>
var s = document.getElementById('s1');
console.log('select.value = ' + s.value);
console.log('childNodes.length = ' + s.childNodes.length);
var child = s.firstChild;
var i = 0;
while(child) {
  console.log('child[' + i + '] nodeType=' + child.nodeType + ' tag=' + (child.tagName||'') + ' value=' + (child.getAttribute ? child.getAttribute('value') : ''));
  child = child.nextSibling;
  i++;
}
</script></body></html>
