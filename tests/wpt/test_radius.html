<!DOCTYPE html><html><body>
<div id="t1" style="width:100px;height:50px;background:red;border-radius:10px;"></div>
<div id="t2" style="width:100px;height:50px;background:blue;border-radius:25px;margin-top:10px;"></div>
<script>
var cs1 = getComputedStyle(document.getElementById('t1'));
var cs2 = getComputedStyle(document.getElementById('t2'));
console.log('t1 border-radius: tl=' + cs1.borderTopLeftRadius + ' tr=' + cs1.borderTopRightRadius);
console.log('t2 border-radius: tl=' + cs2.borderTopLeftRadius + ' tr=' + cs2.borderTopRightRadius);
</script></body></html>
