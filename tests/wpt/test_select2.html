<!DOCTYPE html><html><body>
<select id="s1"><option value="x">X</option><option value="y" selected>Y</option></select>
<script>
var s = document.getElementById('s1');
var child = s.firstChild;
while(child) {
  if(child.nodeType === 1) {
    console.log('option val=' + child.getAttribute('value') + ' selected_attr=' + child.getAttribute('selected') + ' hasAttr=' + child.hasAttribute('selected'));
  }
  child = child.nextSibling;
}
</script></body></html>
