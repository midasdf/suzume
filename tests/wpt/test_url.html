<!DOCTYPE html><html><body><script>
try {
  var u = new URL("http://x.com");
  console.log("URL ok: " + u.hostname);
  console.log("searchParams: " + typeof u.searchParams);
} catch(e) {
  console.log("URL error: " + e.message);
}
try {
  var u2 = new URL("http://example.com/path?foo=bar");
  console.log("searchParams.get: " + u2.searchParams.get("foo"));
} catch(e) {
  console.log("URL2 error: " + e.message);
}
</script></body></html>
