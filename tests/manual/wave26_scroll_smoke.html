<!doctype html>
<html>
<head><meta charset="utf-8"><title>Wave 26 — scroll smoke</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  #box { overflow: auto; height: 200px; border: 2px solid #333; margin-bottom: 20px; }
  #box > div.spacer-top    { height: 800px; background: linear-gradient(#fee, #fff); }
  #box > p#target          { height: 50px; background: #f00; color: #fff; padding: 10px; }
  #box > div.spacer-bottom { height: 400px; background: linear-gradient(#fff, #efe); }
  #log { background: #f4f4f4; padding: 10px; white-space: pre-wrap; font-family: monospace; }
</style></head>
<body>
<h1>Wave 26 — scroll + scrollIntoView smoke</h1>

<div id="box">
  <div class="spacer-top"></div>
  <p id="target">TARGET (should land in view)</p>
  <div class="spacer-bottom"></div>
</div>

<button onclick="document.getElementById('box').scrollTop = 400">scrollTop=400</button>
<button onclick="document.getElementById('box').scrollTop = 0">scrollTop=0</button>
<button onclick="document.getElementById('target').scrollIntoView({block:'center'})">scrollIntoView(center)</button>
<button onclick="document.getElementById('target').scrollIntoView({block:'end'})">scrollIntoView(end)</button>

<pre id="log"></pre>

<script>
var log = document.getElementById('log');
function dump(tag) {
  var b = document.getElementById('box');
  log.textContent += tag + ': scrollTop=' + b.scrollTop + ' scrollLeft=' + b.scrollLeft
    + ' scrollHeight=' + b.scrollHeight + ' clientHeight=' + b.clientHeight + '\n';
}
dump('initial');
document.getElementById('box').scrollTop = 400;
dump('after scrollTop=400');
document.getElementById('target').scrollIntoView({block:'center'});
dump('after scrollIntoView(center)');
</script>
</body></html>
