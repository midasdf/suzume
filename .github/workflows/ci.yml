name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        run: |
          curl -fLsS "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-util-dev libxcb-cursor-dev libx11-dev \
            libcurl4-openssl-dev libsqlite3-dev libwebp-dev libbrotli-dev libwoff-dev \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev fonts-dejavu-core pkg-config

      - name: Format check
        continue-on-error: true
        run: zig fmt --check src/

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Text editing tests
        run: zig build test-ui-input -Doptimize=ReleaseSafe
      - name: CSS regression tests
        run: zig build test-css -Doptimize=ReleaseSafe
      - name: Production DOM, CSS cascade and layout regressions
        run: zig build test-dom-style -Doptimize=ReleaseSafe

  http-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig and HTTP test dependencies
        run: |
          curl -fLsS "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev python3 openssl
      - name: Check changed Zig formatting
        run: zig fmt --check build.zig src/net/http.zig src/net/websocket.zig
      - name: Offline HTTP and TLS regressions (Debug)
        run: python3 tests/http_regression.py
      - name: Offline HTTP and TLS regressions (ReleaseSafe)
        run: python3 tests/http_regression.py -O ReleaseSafe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig and build dependencies
        run: |
          case "$(uname -m)" in arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
          curl -fLsS "https://ziglang.org/download/0.16.0/zig-$arch-macos-0.16.0.tar.xz" | tar -xJ
          echo "ZIG=$PWD/zig-$arch-macos-0.16.0/zig" >> "$GITHUB_ENV"
          echo "SUZUME_ARCH=$arch" >> "$GITHUB_ENV"
          echo "$PWD/zig-$arch-macos-0.16.0" >> "$GITHUB_PATH"
          brew install pkgconf curl sqlite webp brotli woff2
      - name: Build and sign relocatable application bundle
        run: bash scripts/build-macos.sh -j4
      - name: Renderer and input regression tests
        run: |
          prefix="$(brew --prefix)"
          case "$(uname -m)" in arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
          zig build test-ui-input test-text-fallback test-surface -Doptimize=ReleaseSafe \
            -Dtarget="$arch-macos.15.0" --search-prefix "$prefix" \
            --search-prefix "$prefix/opt/curl" --search-prefix "$prefix/opt/sqlite"
      - name: CSS regression tests
        run: |
          case "$(uname -m)" in arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
          zig build test-css -Doptimize=ReleaseSafe -Dtarget="$arch-macos.15.0"
      - name: Production DOM, CSS cascade and layout regressions
        run: zig-out/Suzume.app/Contents/MacOS/suzume --test-dom
      - name: Offline HTTP and WebSocket TLS regressions
        env:
          SUZUME_REQUIRE_WEBSOCKET: "1"
        run: |
          prefix="$(brew --prefix)"
          python3 tests/http_regression.py -I"$prefix/opt/curl/include" -L"$prefix/opt/curl/lib"
          python3 tests/http_regression.py -O ReleaseSafe -I"$prefix/opt/curl/include" -L"$prefix/opt/curl/lib"
      - name: Native window and input smoke tests
        run: |
          clang -fobjc-arc -I deps/libnsfb/include -I src/platform \
            src/platform/cocoa.m tests/cocoa_smoke.m \
            -framework Cocoa -framework CoreGraphics -framework CoreText -o /tmp/cocoa-smoke
          /tmp/cocoa-smoke
          python3 tests/macos_browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Suzume-macos-${{ env.SUZUME_ARCH }}
          path: zig-out/Suzume-macos.zip

  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Zig Security Audit
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "## Zig Security Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pattern | Count | Level |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|-------|" >> "$GITHUB_STEP_SUMMARY"

          total=0

          audit() {
            local pattern="$1" level="$2" label="$3"
            local count
            count=$(grep -rn --include='*.zig' -e "$pattern" src/ 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              echo "| \`$label\` | $count | $level |" >> "$GITHUB_STEP_SUMMARY"
              total=$((total + count))
            fi
            if [ "$GH_EVENT" = "pull_request" ] && [ -n "$GH_BASE_REF" ]; then
              git diff --name-only "origin/$GH_BASE_REF" -- '*.zig' 2>/dev/null | while read -r file; do
                [ -f "$file" ] || continue
                grep -n "$pattern" "$file" 2>/dev/null | while IFS=: read -r line content; do
                  echo "::warning file=$file,line=$line::[$level] $label: $content"
                done
              done
            fi
          }

          audit '@setRuntimeSafety\(false\)' 'Critical' '@setRuntimeSafety(false)'
          audit '@ptrCast' 'Tracked' '@ptrCast'
          audit '@ptrFromInt' 'Tracked' '@ptrFromInt'
          audit '@intFromPtr' 'Tracked' '@intFromPtr'
          audit '@alignCast' 'Tracked' '@alignCast'
          audit 'catch unreachable' 'Review' 'catch unreachable'
          audit 'orelse unreachable' 'Review' 'orelse unreachable'
          audit '@cImport' 'Info' '@cImport'

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $total** patterns tracked" >> "$GITHUB_STEP_SUMMARY"
          echo "_Not bugs — areas requiring careful review during changes._" >> "$GITHUB_STEP_SUMMARY"
